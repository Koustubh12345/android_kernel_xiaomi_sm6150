name: Sweet Kernel KSUN Build

on:
  workflow_dispatch:
    inputs:
      KERNEL_BRANCH:
        description: 'Kernel branch to build'
        required: true
        default: 'master'
      LOCALVERSION:
        description: 'Local version (e.g., -Sweet-KSUN)'
        required: false
        default: '-Sweet-KSUN'

env:
  CHATID: ${{ secrets.CHAT_ID }}
  API_BOT: ${{ secrets.BOT_API }}
  DEVICE_TYPE: "sweet"
  DEFCONFIG: "vendor/sweet_user_defconfig" # Verify this path in your source

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.KERNEL_BRANCH }}
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git make bc bison openssl curl zip kmod cpio flex libelf-dev \
          libssl-dev libtfm-dev wget device-tree-compiler ca-certificates python3 binutils \
          binutils-aarch64-linux-gnu aria2

      - name: Setup KernelSU Next
        run: |
          # 1. Install KSUN driver
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/refs/heads/stable/kernel/setup.sh" | bash -s stable
          
          # 2. Add KSUN Configs to your defconfig
          # We append these directly so the build system sees them
          cat >> arch/arm64/configs/${{ env.DEFCONFIG }} << 'EOF'
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          EOF
          
          # 3. Handle Local Version
          echo "CONFIG_LOCALVERSION=\"${{ github.event.inputs.LOCALVERSION }}\"" >> arch/arm64/configs/${{ env.DEFCONFIG }}

      - name: Execute Build
        run: |
          chmod +x build.sh
          ./build.sh
        shell: bash

      - name: Package AnyKernel3
        run: |
          git clone --depth=1 https://github.com/topnotchfreaks/AnyKernel3 -b master AnyKernel3
          # Assuming build.sh outputs to 'out/arch/arm64/boot/Image.gz-dtb'
          # Adjust this path based on your specific build.sh output
          IMAGE_PATH=$(find out -name "Image.gz-dtb" | head -n 1)
          cp $IMAGE_PATH AnyKernel3/
          cd AnyKernel3
          zip -r9 "../Sweet-KSUN-$(date +'%Y%m%d').zip" *
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sweet-Kernel-KSUN
          path: "*.zip"
