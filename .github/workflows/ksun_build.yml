name: "🚀 Build Sweet KernelSU Next"

on:
  workflow_dispatch:
    inputs:
      KERNEL_TAG:
        description: 'Kernel version tag'
        required: true
        default: 'v1.0'

env:
  CHATID: ${{ secrets.CHAT_ID }}
  API_BOT: ${{ secrets.BOT_API }}
  DEVICE: "sweet"
  DEFCONFIG: "sweet_defconfig"

jobs:
  Build-Kernel:
    name: "🔨 Build Kernel"
    runs-on: ubuntu-latest
    steps:
      - name: "📂 Checkout Source"
        uses: actions/checkout@v4

      - name: "📥 Install Dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y git make bc bison openssl curl zip kmod cpio flex libelf-dev \
          libssl-dev libtfm-dev wget device-tree-compiler ca-certificates python3 binutils \
          binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi aria2

      - name: "🔧 Setup KernelSU Next"
        run: |
          # 1. Install KSUN driver
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/refs/heads/stable/kernel/setup.sh" | bash -s stable
          
          # 2. Apply Manual Hooks for 4.14 (Fixes 'garbage patch' error)
          curl -LSs "https://raw.githubusercontent.com/topnotchfreaks/kernel_patches/main/scope_min_manual_hooks_v1.6.patch" -o hooks.patch
          patch -p1 < hooks.patch || echo "⚠️ Manual hooks failed, check compatibility"

          # 3. Add Configs to sweet_defconfig
          cat >> arch/arm64/configs/${{ env.DEFCONFIG }} << 'EOF'
          CONFIG_KSU=y
          CONFIG_KSU_MANUAL_HOOK=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          EOF

      - name: "🔨 Execute Build Script"
        run: |
          chmod +x build.sh
          ./build.sh
        shell: bash

      - name: "📦 Package AnyKernel3"
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
          # Find the Image file (adjust if your build script puts it elsewhere)
          IMAGE=$(find out -name "Image.gz-dtb" -o -name "Image-dtb" | head -n 1)
          cp $IMAGE AnyKernel3/
          cd AnyKernel3
          zip -r9 "../Sweet-KSUN-${{ github.event.inputs.KERNEL_TAG }}.zip" * -x .git/*
          
      - name: "📤 Upload Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: Sweet-Kernel-KSUN
          path: "*.zip"

      - name: "📱 Send to Telegram"
        if: env.API_BOT != ''
        run: |
          ZIP_FILE=$(ls *.zip)
          curl -F document=@"$ZIP_FILE" "https://api.telegram.org/bot${{ env.API_BOT }}/sendDocument?chat_id=${{ env.CHATID }}&caption=✅ Sweet KSUN Build Complete!"

