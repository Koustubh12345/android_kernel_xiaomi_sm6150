name: Sweet Kernel CI
on:
  workflow_dispatch:
    inputs:
      KERNEL_TAG:
        description: 'Kernel version tag (e.g., v1.0)'
        required: true
        default: 'v1.0'

env:
  CHATID: ${{ secrets.CHAT_ID }}
  API_BOT: ${{ secrets.BOT_API }}
  KERNEL_TAG: ${{ github.event.inputs.KERNEL_TAG }}
  DEVICE_TYPE: "sweet"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v3
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git make bc bison openssl curl zip kmod cpio flex libelf-dev \
          libssl-dev libtfm-dev wget device-tree-compiler ca-certificates python3 binutils \
          binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

      - name: Execute Build Script
        run: |
          chmod +x build.sh
          ./build.sh
        shell: bash
